<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stat · Tokyo Paper</title>
  <link rel="stylesheet" href="../../tokyo-paper.css">
  <link rel="stylesheet" href="../../demo/demo.css">
</head>
<body>
  <main>
    <p class="tp-eyebrow"><a href="../../index.html">Tokyo Paper</a> · Content</p>
    <h1>Stat</h1>
    <p>Stats show key numbers at a glance. Highlight at most one value per group.</p>

    <div class="demo-row demo-theme" role="group" aria-label="Theme">
      <button class="tp-button tp-button--quiet" type="button" data-set-theme="" aria-pressed="true">Auto</button>
      <button class="tp-button tp-button--quiet" type="button" data-set-theme="paper" aria-pressed="false">Paper</button>
      <button class="tp-button tp-button--quiet" type="button" data-set-theme="night" aria-pressed="false">Night</button>
    </div>

    <section>
      <p class="tp-eyebrow">Stat</p>
      <dl class="tp-stats">
        <div class="tp-stat tp-stat--highlight">
          <dt class="tp-stat__key">Task completion</dt>
          <dd class="tp-stat__value">94<span class="tp-stat__unit">%</span></dd>
          <dd class="tp-stat__note">Across all age groups</dd>
        </div>
        <div class="tp-stat">
          <dt class="tp-stat__key">Response time</dt>
          <dd class="tp-stat__value">42<span class="tp-stat__unit">ms</span></dd>
          <dd class="tp-stat__note">Median, last 7 days</dd>
        </div>
        <div class="tp-stat">
          <dt class="tp-stat__key">SUS score</dt>
          <dd class="tp-stat__value">78</dd>
          <dd class="tp-stat__note">Target is 70 or more</dd>
        </div>
        <div class="tp-stat">
          <dt class="tp-stat__key">Participants</dt>
          <dd class="tp-stat__value">20</dd>
          <dd class="tp-stat__note">5 per age group</dd>
        </div>
      </dl>
    </section>
  </main>

  <script src="../../demo/demo.js"></script>
</body>
</html>
