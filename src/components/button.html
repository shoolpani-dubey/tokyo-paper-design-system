<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Button · Tokyo Paper</title>
  <link rel="stylesheet" href="../tokyo-paper.css">
  <style>
    /* Page layout for this reference only */
    main {
      max-width: var(--container-max);
      margin: 0 auto;
      padding: var(--space-8) var(--gutter);
    }
    section {
      border-top: var(--line-width) solid var(--line);
      padding-block: var(--space-6);
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--space-2);
    }
    .eyebrow {
      margin: 0 0 var(--space-3);
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      letter-spacing: var(--tracking-label);
      text-transform: uppercase;
      color: var(--ink-3);
    }
    .surface {
      padding: var(--space-5);
      background: var(--paper-raised);
      border: var(--line-width) solid var(--line);
    }
    .theme-switch {
      margin-bottom: var(--space-7);
    }
    .theme-switch [aria-pressed="true"] {
      --_line: var(--accent);
      --_fg: var(--ink);
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Component · 10</p>
    <h1>Button</h1>
    <p>Buttons start an action. Use the verb for the label (“Save changes”, not “OK”). Use one primary button per view.</p>

    <div class="row theme-switch" role="group" aria-label="Theme">
      <button class="tp-button tp-button--quiet" type="button" data-set-theme="" aria-pressed="true">Auto</button>
      <button class="tp-button tp-button--quiet" type="button" data-set-theme="paper" aria-pressed="false">Paper</button>
      <button class="tp-button tp-button--quiet" type="button" data-set-theme="night" aria-pressed="false">Night</button>
    </div>

    <section>
      <p class="eyebrow">Variants</p>
      <div class="row">
        <button class="tp-button tp-button--primary" type="button">
          Save changes
          <span class="tp-button__arrow" aria-hidden="true">→</span>
        </button>
        <button class="tp-button" type="button">Preview</button>
        <button class="tp-button tp-button--quiet" type="button">Cancel</button>
        <button class="tp-button tp-button--icon" type="button" aria-label="Search">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" aria-hidden="true">
            <circle cx="8.5" cy="8.5" r="5.5"/>
            <path d="M12.5 12.5 17 17"/>
          </svg>
        </button>
      </div>
    </section>

    <section>
      <p class="eyebrow">On a raised surface</p>
      <div class="surface row">
        <button class="tp-button tp-button--primary" type="button">Create project</button>
        <button class="tp-button" type="button">Import</button>
        <button class="tp-button tp-button--quiet" type="button">Learn more</button>
      </div>
    </section>

    <section>
      <p class="eyebrow">States</p>
      <div class="row">
        <button class="tp-button tp-button--primary" type="button" disabled>Disabled</button>
        <button class="tp-button" type="button" disabled>Disabled</button>
        <button class="tp-button tp-button--primary" type="button" data-state="busy" aria-disabled="true">
          <span class="tp-button__spinner" aria-hidden="true"></span>
          Saving…
        </button>
        <button class="tp-button tp-button--primary" type="button" data-demo="busy">Click to save</button>
      </div>
    </section>

    <section>
      <p class="eyebrow">As a link</p>
      <div class="row">
        <a class="tp-button tp-button--primary" href="#">Get started <span class="tp-button__arrow" aria-hidden="true">→</span></a>
        <a class="tp-button" href="#">Read the docs</a>
      </div>
    </section>

    <section>
      <p class="eyebrow">Compact density (desktop, fine pointer only)</p>
      <div class="row" data-density="compact">
        <button class="tp-button tp-button--primary" type="button">Apply</button>
        <button class="tp-button" type="button">Discard</button>
        <button class="tp-button tp-button--quiet" type="button">Reset</button>
      </div>
    </section>
  </main>

  <!-- Demo only: the component itself needs no JavaScript. -->
  <script>
    document.querySelectorAll("[data-set-theme]").forEach((button) => {
      button.addEventListener("click", () => {
        const theme = button.dataset.setTheme;
        if (theme) document.documentElement.dataset.theme = theme;
        else delete document.documentElement.dataset.theme;
        document.querySelectorAll("[data-set-theme]").forEach((b) => b.setAttribute("aria-pressed", b === button));
      });
    });

    const demo = document.querySelector('[data-demo="busy"]');
    demo.addEventListener("click", () => {
      if (demo.dataset.state === "busy") return;
      demo.dataset.state = "busy";
      demo.setAttribute("aria-disabled", "true");
      demo.innerHTML = '<span class="tp-button__spinner" aria-hidden="true"></span> Saving…';
      setTimeout(() => {
        delete demo.dataset.state;
        demo.removeAttribute("aria-disabled");
        demo.textContent = "Saved ✓";
      }, 1500);
    });
  </script>
</body>
</html>
